<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pocket – shopping list, to-dos and appointments in one place.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141518" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pocket">
  <title>Pocket</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tab="today">
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title">Today</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn voice-btn" id="voice-btn" type="button" aria-label="Speak a command" data-voice hidden>
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
        </button>
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Settings and backup">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <main>
      <section class="view" data-view="today" id="today-view"></section>

      <section class="view" data-view="shopping" hidden>
        <form class="quick-add" id="shop-add" autocomplete="off">
          <input id="shop-input" name="item" list="shop-history" placeholder="Add item, e.g. “2 milk”" enterkeyhint="done" aria-label="New shopping item">
          <button type="button" class="mic-btn" data-mic="shop" data-voice hidden aria-label="Say items to add" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
          </button>
          <button type="submit">Add</button>
        </form>
        <datalist id="shop-history"></datalist>
        <div id="shop-list"></div>
      </section>

      <section class="view" data-view="todos" hidden>
        <form class="quick-add" id="todo-add" autocomplete="off">
          <input id="todo-input" name="todo" placeholder="Add a to-do…" enterkeyhint="done" aria-label="New to-do">
          <button type="button" class="mic-btn" data-mic="todo" data-voice hidden aria-label="Say a to-do" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
          </button>
          <button type="submit">Add</button>
        </form>
        <div id="todo-list"></div>
      </section>

      <section class="view" data-view="calendar" hidden>
        <div id="appt-list"></div>
      </section>
    </main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Add">
    <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
  </button>

  <nav class="tabbar" aria-label="Sections">
    <div class="tabbar-inner">
      <button type="button" data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        <span>Today</span>
      </button>
      <button type="button" data-tab="shopping">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.2a1.5 1.5 0 0 1-1.5 1.3H7.7a1.5 1.5 0 0 1-1.5-1.3L5 8z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg>
        <span>Shopping</span><b class="badge" hidden></b>
      </button>
      <button type="button" data-tab="todos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6.5h10M10 12h10M10 17.5h10"/><path d="M3.5 6.5l1.6 1.6 2.6-2.8M3.5 12l1.6 1.6 2.6-2.8M3.5 17.5l1.6 1.6 2.6-2.8"/></svg>
        <span>To-dos</span><b class="badge" hidden></b>
      </button>
      <button type="button" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>Calendar</span><b class="badge" hidden></b>
      </button>
    </div>
  </nav>

  <dialog class="sheet" id="sheet"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="recipes.js"></script>
  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
